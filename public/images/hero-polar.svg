<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Illustration of Indian research vessel sailing towards Antarctica's icy coast at sunrise">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b3d"/>
      <stop offset="55%" stop-color="#3260e1"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="480" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="620" cy="210" r="58" fill="url(#sun)" opacity="0.9"/>
  <circle cx="620" cy="210" r="80" fill="#fbbf24" opacity="0.18"/>
  <circle cx="620" cy="210" r="105" fill="#fbbf24" opacity="0.10"/>

  <!-- distant icebergs -->
  <path d="M60 320 L120 230 L170 260 L205 215 L250 320 Z" fill="#e0f2fe"/>
  <path d="M230 320 L290 240 L330 275 L365 320 Z" fill="#bae6fd"/>
  <path d="M620 320 L665 250 L700 290 L740 320 Z" fill="#bae6fd" opacity="0.8"/>
  <path d="M120 330 L150 295 L185 330 Z" fill="#7dd3fc" opacity="0.6"/>
  <path d="M470 325 L505 285 L540 325 Z" fill="#7dd3fc" opacity="0.6"/>

  <!-- sea -->
  <path d="M0 320 Q40 306 80 320 T160 320 T240 320 T320 320 T400 320 T480 320 T560 320 T640 320 T720 320 T800 320 L800 480 L0 480 Z" fill="url(#sea)"/>
  <path d="M0 352 Q60 340 120 352 T240 352 T360 352 T480 352 T600 352 T720 352 T800 352 L800 480 L0 480 Z" fill="#1e3a8a" opacity="0.55"/>
  <path d="M0 400 Q80 388 160 400 T320 400 T480 400 T640 400 T800 400 L800 480 L0 480 Z" fill="#172554" opacity="0.5"/>

  <!-- wave crests -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M80 334 Q100 326 120 334"/>
    <path d="M300 334 Q320 326 340 334"/>
    <path d="M530 334 Q550 326 570 334"/>
    <path d="M700 334 Q720 326 740 334"/>
    <path d="M180 366 Q200 358 220 366"/>
    <path d="M420 366 Q440 358 460 366"/>
    <path d="M90 404 Q110 396 130 404"/>
    <path d="M580 404 Q600 396 620 404"/>
  </g>

  <!-- research ship -->
  <g transform="translate(300 250)">
    <!-- hull -->
    <path d="M-95 60 Q-90 90 -55 96 L55 96 Q90 90 95 60 L70 60 L60 40 L60 20 Q30 6 -30 6 L-60 20 L-70 40 Z" fill="#b91c1c"/>
    <path d="M-85 96 L-55 96 Q-90 90 -95 60 L-70 40 L-60 20 L-30 6 L-40 30 L-85 88 Z" fill="#dc2626"/>
    <!-- deck -->
    <path d="M-30 6 L30 6 L60 20 L-60 20 Z" fill="#fef3c7"/>
    <path d="M-60 20 L60 20 L55 40 L-70 40 Z" fill="#475569"/>
    <!-- white stripe -->
    <path d="M-80 60 L80 60 L78 50 L-82 50 Z" fill="#f8fafc"/>
    <!-- wheelhouse -->
    <rect x="-22" y="-32" width="44" height="38" rx="4" fill="#e2e8f0"/>
    <rect x="-14" y="-26" width="12" height="12" rx="2" fill="#7dd3fc"/>
    <rect x="4" y="-26" width="12" height="12" rx="2" fill="#7dd3fc"/>
    <path d="M-20 -34 Q0 -46 20 -34 L20 -32 L-20 -32 Z" fill="#334155"/>
    <!-- funnel -->
    <rect x="-26" y="-64" width="10" height="34" rx="2" fill="#0f172a"/>
    <rect x="-31" y="-72" width="21" height="10" rx="2" fill="#0f172a"/>
    <!-- mast -->
    <line x1="0" y1="-72" x2="0" y2="-96" stroke="#0f172a" stroke-width="3"/>
    <path d="M0 -96 L12 -92 L0 -88 Z" fill="#f59e0b"/>
    <!-- radar -->
    <rect x="-70" y="-14" width="10" height="20" rx="3" fill="#0f172a"/>
    <circle cx="-65" cy="-22" r="5" fill="#38bdf8"/>
    <!-- railings -->
    <line x1="-58" y1="34" x2="58" y2="34" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="-58" y1="34" x2="-58" y2="22"/>
      <line x1="-30" y1="34" x2="-30" y2="22"/>
      <line x1="0" y1="34" x2="0" y2="22"/>
      <line x1="30" y1="34" x2="30" y2="22"/>
      <line x1="58" y1="34" x2="58" y2="22"/>
    </g>
  </g>

  <!-- penguin on ice floe -->
  <g transform="translate(150 255)">
    <path d="M-40 110 Q-50 140 -20 145 L50 145 Q80 140 70 115 L55 100 L45 92 L-30 92 L-35 100 Z" fill="#e0f2fe"/>
    <path d="M-30 92 L-40 105 Q-55 130 -28 138 L36 138 Q60 132 55 108 L45 92 Z" fill="#f8fafc"/>
    <g transform="translate(5 20)">
      <ellipse cx="0" cy="10" rx="18" ry="22" fill="#0f172a"/>
      <ellipse cx="0" cy="16" rx="13" ry="14" fill="#f8fafc"/>
      <ellipse cx="0" cy="20" rx="9" ry="9" fill="#fbbf24"/>
      <circle cx="-5" cy="-14" r="5" fill="#0f172a"/>
      <circle cx="6" cy="-14" r="5" fill="#0f172a"/>
      <path d="M0 8 L6 12 L0 12 Z" fill="#fb923c"/>
      <path d="M-14 6 Q-24 2 -20 -8 Q-8 -4 0 2" fill="#0f172a"/>
      <path d="M14 6 Q24 2 20 -8 Q8 -4 0 2" fill="#0f172a"/>
      <ellipse cx="0" cy="30" rx="4" ry="8" fill="#f59e0b"/>
      <ellipse cx="0" cy="30" rx="4" ry="8" fill="#f59e0b"/>
    </g>
  </g>

  <!-- flying birds -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M120 90 Q130 80 140 88 Q150 80 160 90"/>
    <path d="M170 70 Q178 62 186 69 Q194 62 202 70"/>
    <path d="M80 115 Q88 107 96 114 Q104 107 112 115"/>
  </g>

  <!-- stars (upper sky) -->
  <g fill="#ffffff">
    <circle cx="90" cy="40" r="2" opacity="0.8"/>
    <circle cx="180" cy="90" r="1.5" opacity="0.6"/>
    <circle cx="260" cy="35" r="2" opacity="0.7"/>
    <circle cx="360" cy="70" r="1.5" opacity="0.5"/>
    <circle cx="450" cy="40" r="2" opacity="0.6"/>
    <circle cx="540" cy="90" r="1.5" opacity="0.5"/>
    <circle cx="700" cy="60" r="2" opacity="0.7"/>
    <circle cx="760" cy="120" r="1.5" opacity="0.5"/>
  </g>
</svg>